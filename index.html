<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Model Observatory - AI 模型数据看板，聚合排名、评测、价格、发布动态、提供商分析" />
    <meta name="theme-color" content="#141418" />
    <title>Model Observatory</title>
    <link rel="icon" type="image/svg+xml" href="/icons/app-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      (function() {
        try {
          var stored = null;
          var theme = JSON.parse(localStorage.getItem('theme') || '{}');
          if (theme.state && (theme.state.themeMode === 'dark' || theme.state.themeMode === 'light')) {
            stored = theme.state.themeMode;
          }
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || (stored == null && prefersDark);
          if (dark) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
